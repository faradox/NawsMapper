name: CI

# Every push to main that passes all jobs updates the downloads on the Releases page
# (see the "release" job and docs/releasing.md). Pull requests only build and test.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Compiled into the app and shown in Help → Version (crates/om-app/src/build_info.rs).
  NAWSMAPPER_BUILD: ${{ github.run_number }}
  NAWSMAPPER_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  check:
    name: Lint & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: bash scripts/bundle-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: NawsMapper-macOS
          path: dist/NawsMapper-macOS.dmg
          if-no-files-found: error

  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p om-app
      - name: Name the download
        shell: bash
        run: mkdir -p dist && cp target/release/nawsmapper.exe dist/NawsMapper-Windows.exe
      - uses: actions/upload-artifact@v7
        with:
          name: NawsMapper-Windows
          path: dist/NawsMapper-Windows.exe
          if-no-files-found: error

  release:
    name: Publish downloads
    needs: [check, macos, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One publish at a time; a newer waiting run replaces an older waiting one.
    concurrency:
      group: publish-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # history and tags, for the "what's new" list
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: bash scripts/publish-release.sh dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
